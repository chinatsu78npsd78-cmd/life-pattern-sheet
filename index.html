<style>
main{max-width:660px}.screen{gap:24px}.title.big{font-size:clamp(27px,6.5vw,38px);letter-spacing:.08em}.kicker{font-size:12px;letter-spacing:.18em;text-align:center;color:var(--steel)}.intro-title{line-height:1.8}.intro-title span{display:block}.intro-note{font-size:13px;line-height:1.9;color:var(--ink-soft);text-align:center}.flow{display:flex;flex-wrap:wrap;gap:7px 10px;justify-content:center;font-size:12px;color:var(--steel)}.flow span:not(:last-child)::after{content:' →';color:#b3a0b2;margin-left:7px}textarea{display:block;resize:vertical;width:100%;min-height:174px;padding:18px;border:1px solid var(--line);border-radius:15px;background:#fffffff0;color:var(--ink);font:inherit;font-size:16px;line-height:1.85;box-shadow:0 10px 30px #6d547006}textarea:focus{outline:2px solid #44778c;outline-offset:3px}.answer-label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:9px}.answer-meta{display:flex;justify-content:space-between;gap:12px;color:var(--ink-soft);font-size:11px;margin-top:8px}.btn{letter-spacing:.06em}.btn:disabled{opacity:.45;cursor:not-allowed}.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}.row .btn{font-size:13px}.optional{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.chip{font:inherit;font-size:13px;color:var(--steel);background:#fff9;border:1px solid var(--line);border-radius:99px;padding:8px 14px;cursor:pointer}.chip:hover{border-color:var(--blue)}.hint{font-size:13px;color:var(--ink-soft);text-align:center;margin:0}.notice{font-size:13px;color:var(--ink-soft);padding:12px 16px;background:#edf4f5;border-radius:12px}.quote{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;border-left:2px solid #c79a4c;padding:10px 16px;font-size:14px}.quote-label{font-size:11px;color:var(--steel);margin-bottom:6px}.summary-card{background:#ffffffe6;border:1px solid var(--line);border-radius:16px;padding:20px}.summary-card h3{font-family:var(--serif);font-size:16px;margin:0;color:var(--steel)}.summary-card p{white-space:pre-wrap;overflow-wrap:anywhere;margin:10px 0 0}.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.edit{border:0;background:none;color:var(--ink-soft);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;white-space:nowrap}.empty{color:#61767b;font-size:13px}.quiet{border:0;background:none;font:inherit;font-size:12px;color:var(--ink-soft);text-decoration:underline;cursor:pointer}.ack{color:var(--ink-soft);font-size:13px;text-align:center;margin:0}.summary-grid{display:grid;gap:12px}.compare{display:grid;gap:15px}.compare-arrow{text-align:center;color:var(--pink)}.closing{font-size:14px;line-height:2}.privacy{font-size:11px;color:var(--ink-soft);letter-spacing:.03em;line-height:1.9}.btn.line{font-family:var(--sans);font-size:14px}dialog{max-width:480px;width:calc(100% - 32px);border:1px solid var(--line);border-radius:20px;padding:28px;color:var(--ink);background:#fff;line-height:1.9}dialog::backdrop{background:#16343c55}dialog h2{font:600 20px var(--serif);margin-top:0}dialog .row{margin-top:20px}footer{padding-top:32px}.screen>h1,.screen>h2{outline:none}.mini{font-size:12px}.sheet-date{text-align:center;font-size:12px;color:var(--ink-soft)}
@media print{body{background:white;padding:0;font-size:12px}.glow,.no-print,footer,.brand{display:none!important}main{max-width:none;padding:0}.screen{padding:0;gap:16px}.summary-card{break-inside:avoid;border:1px solid #ddd;padding:14px}.summary-card h3{font-size:14px}.grad{color:#16343c;background:none}.panel{background:white}.title{font-size:24px}.summary-grid{gap:8px}}
</style>
